<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Web Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0e1621; color: white; }
        .sidebar { background-color: #17212b; }
        .chat-area { background-color: #0e1621; background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); }
        .message-in { background-color: #182533; border-radius: 10px; }
        .message-out { background-color: #2b5278; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <div class="sidebar w-1/3 border-r border-gray-900 hidden md:flex flex-col">
        <div class="p-4 border-b border-gray-900 flex items-center justify-between">
            <h1 class="text-xl font-bold">Telegram</h1>
            <button class="text-gray-400">☰</button>
        </div>
        <div class="overflow-y-auto">
            <div class="flex items-center p-4 hover:bg-[#202b36] cursor-pointer">
                <div class="w-12 h-12 bg-blue-500 rounded-full flex items-center justify-center font-bold">G</div>
                <div class="ml-4">
                    <p class="font-semibold">Gemini AI</p>
                    <p class="text-sm text-gray-400">Lagi ngoding nih...</p>
                </div>
            </div>
        </div>
    </div>

    <div class="flex-1 flex flex-col chat-area">
        <div class="p-4 bg-[#17212b] border-b border-gray-900 flex items-center">
            <div class="w-10 h-10 bg-blue-500 rounded-full flex items-center justify-center font-bold">G</div>
            <div class="ml-4">
                <p class="font-semibold">Gemini AI</p>
                <p class="text-xs text-blue-400">online</p>
            </div>
        </div>

        <div id="chat-box" class="flex-1 p-6 overflow-y-auto flex flex-col space-y-4">
            <div class="message-in p-3 self-start max-w-xs text-sm">
                Halo! Ini adalah tampilan Telegram buatanmu sendiri.
            </div>
            <div class="message-out p-3 self-end max-w-xs text-sm text-white">
                Wah keren! Sudah online di GitHub ya?
            </div>
        </div>

        <div class="p-4 bg-[#17212b]">
            <div class="flex items-center space-x-2">
                <input id="message-input" type="text" placeholder="Tulis pesan..." class="flex-1 bg-transparent border-none outline-none text-white p-2">
                <button onclick="sendMessage()" class="bg-blue-500 hover:bg-blue-600 p-2 px-4 rounded-lg">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('message-input');
            const chatBox = document.getElementById('chat-box');
            
            if (input.value.trim() !== "") {
                const newMsg = document.createElement('div');
                newMsg.className = "message-out p-3 self-end max-w-xs text-sm text-white";
                newMsg.innerText = input.value;
                chatBox.appendChild(newMsg);
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
